<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#145b52">
<title>生态环境题库·拍照搜答案</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#172b28;background:#f3f7f6}
*{box-sizing:border-box}body{margin:0}header{background:#145b52;color:white;padding:20px 16px 18px}
header h1{font-size:21px;margin:0 0 6px}header p{font-size:13px;margin:0;opacity:.86}
main{max-width:760px;margin:auto;padding:14px 12px 40px}
.panel{background:white;border:1px solid #dce8e5;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #1232}
h2{font-size:16px;margin:0 0 12px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
button,.filebtn{border:0;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:650;background:#145b52;color:white;cursor:pointer}
button.secondary,.filebtn.secondary{background:#e8f1ef;color:#145b52}
button:disabled{opacity:.5;cursor:not-allowed}
#camera{width:100%;max-height:52vh;background:#111;border-radius:12px;display:none;object-fit:contain}
#preview{width:100%;max-height:38vh;object-fit:contain;display:none;border-radius:12px;margin-top:10px}
input[type=file]{display:none}
.status{font-size:13px;color:#60736f;margin-top:9px;min-height:20px}
textarea{width:100%;min-height:104px;border:1px solid #cbdad6;border-radius:10px;padding:11px;font:14px/1.5 inherit;resize:vertical}
.small{font-size:12px;color:#6b7e79;line-height:1.55}
.result{border:1px solid #dce8e5;border-radius:12px;padding:12px;margin-top:10px}
.result h3{font-size:15px;line-height:1.55;margin:0 0 8px}
.meta{font-size:12px;color:#60736f;margin-bottom:7px}
.option{font-size:14px;line-height:1.55;padding:5px 8px;border-radius:8px;margin:3px 0}
.option.correct{background:#e1f5e9;color:#126c37;font-weight:700}
.answer{display:inline-block;background:#e1f5e9;color:#126c37;padding:5px 10px;border-radius:8px;font-weight:750;margin-top:8px}
.score{float:right;color:#60736f;font-size:12px}
#results:empty:after{content:"识别或输入题目后，匹配结果会显示在这里。";color:#8a9995;font-size:13px}
footer{font-size:12px;color:#71817d;text-align:center;padding:8px}

/* 手机单屏紧凑布局 */
html,body{height:100%;min-height:0}
body{overflow:hidden}
header{padding:9px 13px 8px}
header h1{font-size:17px;margin:0 0 2px}
header p{font-size:11px;line-height:1.35}
main{
  height:calc(100dvh - 56px);
  max-width:760px;
  margin:0 auto;
  padding:7px 9px calc(7px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:7px;
  overflow:hidden;
}
.panel{margin:0;padding:9px 10px;border-radius:12px;box-shadow:none}
.panel h2{font-size:14px;margin:0 0 7px}
main>.panel:first-child{flex:0 0 auto}
.actions{gap:6px}
button,.filebtn{padding:9px 11px;font-size:13px;border-radius:9px}
#camera{max-height:19dvh;width:100%;margin-top:7px;object-fit:contain}
#preview{max-height:19dvh;margin-top:6px}
#ocrStatus{font-size:11px;line-height:1.35;margin-top:5px;min-height:15px}
.small{font-size:10px;line-height:1.35;margin:5px 0 0}
main>.panel:nth-of-type(2){flex:1 1 auto;min-height:0;overflow:auto}
#results{display:grid;grid-template-columns:1fr;gap:6px}
.result{margin:0;padding:8px 9px;border-radius:9px}
.result h3{font-size:12px;line-height:1.4;margin:2px 0 5px}
.meta{font-size:10px;margin-bottom:3px}
.option{font-size:11px;line-height:1.3;padding:2px 5px;margin:1px 0}
.answer{font-size:11px;padding:3px 7px;margin-top:5px}
footer{display:none}
#results:empty:after{font-size:11px}
@media (max-width:390px){
  header h1{font-size:16px}
  main{padding-left:7px;padding-right:7px;gap:6px}
  .panel{padding:8px}
  button,.filebtn{padding:8px 9px;font-size:12px}
  #camera,#preview{max-height:16dvh}
  .small{font-size:9px}
}
@media (max-height:700px){
  header{padding-top:6px;padding-bottom:5px}
  main{height:calc(100dvh - 46px);padding-top:5px;gap:5px}
  #camera,#preview{max-height:14dvh}
  .small{display:none}
}

</style>
</head>
<body>
<header><h1>生态环境题库 · 拍照搜答案</h1><p>使用摄像头识别题目文字，在本地内置题库中检索答案</p></header>
<main>
<section class="panel">
<h2>① 拍摄题目</h2>
<div class="actions">
<button id="start">打开摄像头</button>
<button id="capture" disabled>拍照识别</button>
<button id="stop" class="secondary" disabled>关闭摄像头</button>
<label class="filebtn secondary" for="imageFile">从相册选图片</label>
<input id="imageFile" type="file" accept="image/*">
</div>
<video id="camera" playsinline autoplay muted></video>
<canvas id="canvas" hidden></canvas>
<img id="preview" alt="拍摄或选择的题目图片">
<div id="ocrStatus" class="status">提示：首次使用OCR需联网下载中文识别组件和语言数据。</div>
<p class="small">将题干和选项对准画面；摄像头需在HTTPS网页中使用。</p>
</section>
<textarea id="ocrText" aria-hidden="true" tabindex="-1" style="display:none"></textarea>
<div id="searchStatus" class="status" style="display:none"></div>
<button id="search" style="display:none">在题库中查找答案</button>
<button id="clear" style="display:none">清空</button>
<section class="panel">
<h2>③ 题库匹配结果</h2>
<div id="results"></div>
</section>
<footer>题库数据：1653 道题 · 内置于本网页 · 检索在本机浏览器中完成</footer>
</main>

<script>

境主管部门","正确答案":"A、B、C、D"},{"题号":"题1226","题干":"根据《中华人民共和国生态环境法典》，禁止向耕地、林地、草地等农用地排放下列哪些物质（ ）。","A选项":"A. 重金属","B选项":"B. 其他有毒有害物质含量超标的污水、污泥","C选项":"C. 可能造成土壤污染的清淤底泥","D选项":"D. 可能造成土壤污染的尾矿、矿渣","正确答案":"A、B、C、D"},{"题号":"题1227","题干":"根据《中华人民共和国生态环境法典》，关于农用地土壤污染风险管控和修复，国家建立健全农用地分类管理制度。按照土壤污染程度和相关标准，将农用地划分为（ ）。","A选项":"A. 优先保护类","B选项":"B. 安全利用类","C选项":"C. 严格管控类","D选项":"D. 禁止利用类","正确答案":"A、B、C"},{"题号":"题1228","题干":"根据《中华人民共和国生态环境法典》，对严格管控类农用地地块，地方人民政府农业农村主管部门、林业草原主管部门应当在各自职责范围内采取下列哪些风险管控措施（ ）。","A选项":"A. 提出划定特定农产品禁止生产区域的建议，报本级人民政府批准后实施","B选项":"B. 按照规定开展土壤和农产品协同监测与评价","C选项":"C. 对农民、农民专业合作社及其他农业生产经营主体进行技术指导和培训","D选项":"D. 其他风险管控措施","正确答案":"A、B、C、D"},{"题号":"题1229","题干":"根据《中华人民共和国生态环境法典》，关于建设用地土壤污染风险管控和修复名录，下列说法正确的有（ ）。","A选项":"A. 国家实行建设用地土壤污染风险管控和修复名录制度","B选项":"B. 名录由省级人民政府生态环境主管部门会同自然资源等有关部门制定","C选项":"C. 列入名录的地块，不得作为居住、公共管理与公共服务用地","D选项":"D. 达到风险管控、修复目标且可以安全利用的地块，可以申请移出名录","正确答案":"A、B、C、D"},{"题号":"题1230","题干":"根据《中华人民共和国生态环境法典》，关于土壤污染风险管控和修复活动的实施要求，下列说法正确的有（ ）。","A选项":"A. 实施风险管控、修复活动，应当因地制宜、科学合理，提高针对性和有效性","B选项":"B. 实施风险管控、修复活动，不得对土壤和周边环境造成新的污染","C选项":"C. 实施风险管控、修复活动中产生的废水、废气和固体废物，应当按照规定进行处理、处置，并达到相关生态环境保护标准","D选项":"D. 修复施工期间，应当设立公告牌，向社会公开相关情况和生态环境保护措施","正确答案":"A、B、C、D"},{"题号":"题1231","题干":"根据《中华人民共和国生态环境法典》，生态环境保护坚持的原则包括（ ）。","A选项":"A. 预防为主、系统治理","B选项":"B. 生态优先、绿色发展","C选项":"C. 公众参与、损害担责","D选项":"D. 先污染后治理","正确答案":"A、B、C"},{"题号":"题1232","题干":"根据《中华人民共和国生态环境法典》，企业事业单位和其他生产经营者应当采取有效措施，履行下列哪些义务（ ）。","A选项":"A. 防止、减少环境污染和生态破坏","B选项":"B. 节约集约利用资源","C选项":"C. 控制温室气体排放","D选项":"D. 履行绿色低碳发展义务，并对所造成的损害依法承担责任","正确答案":"A、B、C、D"},{"题号":"题1233","题干":"根据《中华人民共和国生态环境法典》，国务院生态环境主管部门在其职责范围内对全国生态环境保护工作实施统一监督管理，具体包括（ ）。","A选项":"A. 统一政策规划标准制定","B选项":"B. 统一监测评估","C选项":"C. 统一监督执法","D选项":"D. 统一督察问责","正确答案":"A、B、C、D"},{"题号":"题1234","题干":"根据《中华人民共和国生态环境法典》，国家建立健全生态环境保护责任清单制度，明确（ ）的生态环境保护监督管理职责。","A选项":"A. 国务院有关部门","B选项":"B. 地方人民政府有关部门","C选项":"C. 企业事业单位","D选项":"D. 社会组织","正确答案":"A、B"},{"题号":"题1235","题干":"根据《中华人民共和国生态环境法典》，省、市、县、乡依法建立健全河湖长制、林长制。各级河湖长负责本行政区域江河湖泊管理和保护相关工作；各级林长负责本行政区域森林草原资源保护发展相关工作。关于该制度，下列说法正确的有（ ）。","A选项":"A. 河湖长制、林长制在省、市、县、乡四级建立健全","B选项":"B. 河湖长负责江河湖泊管理和保护相关工作","C选项":"C. 林长负责森林草原资源保护发展相关工作","D选项":"D. 河湖长、林长可以代替生态环境主管部门统一监督管理","正确答案":"A、B、C"},{"题号":"题1236","题干":"根据《中华人民共和国生态环境法典》，国家完善生态安全工作协调机制，采取有效措施提升下列哪些能力，形成全域联动、立体高效的生态安全防护体系（ ）。","A选项":"A. 生态安全风险研判评估","B选项":"B. 监测预警","C选项":"C. 应急应对和处置","D选项":"D. 生态产品经营开发","正确答案":"A、B、C"},{"题号":"题1237","题干":"根据《中华人民共和国生态环境法典》，国家实行生态环境保护督察制度，生态环境保护督察实行中央和省、自治区、直辖市两级督察体制。被督察对象收到生态环境保护督察反馈意见后，应当组织编制督察整改方案，针对督察反馈问题逐项明确（ ）。","A选项":"A. 整改实施主体","B选项":"B. 整改目标","C选项":"C. 整改时限","D选项":"D. 重点措施和验收单位","正确答案":"A、B、C、D"},{"题号":"题1238","题干":"根据《中华人民共和国生态环境法典》，国家加强生态的保护与修复，坚持山水林田湖草沙一体化保护与修复，实行自然恢复为主、自然恢复与人工修复相结合的系统治理。下列属于该制度内容的有（ ）。","A选项":"A. 一体化保护与修复","B选项":"B. 自然恢复为主","C选项":"C. 自然恢复与人工修复相结合","D选项":"D. 全面人工修复为主","正确答案":"A、B、C"},{"题号":"题1239","题干":"根据《中华人民共和国生态环境法典》，国家统筹水资源、水环境、水生态治理，实行水资源刚性约束制度，坚持以水定城、以水定地、以水定人、以水定产。该制度的目的包括（ ）。","A选项":"A. 促进人口和城市科学合理布局","B选项":"B. 构建与水资源承载能力相适应的现代产业体系","C选项":"C. 保障国家水安全","D选项":"D. 扩大高耗水产业规模","正确答案":"A、B、C"},{"题号":"题1240","题干":"根据《中华人民共和国生态环境法典》，引进外来物种以及研究、开发和利用生物技术，应当采取有效措施，防止对生物多样性的破坏。国家加强生物多样性保护，建立健全下列哪些制度（ ）。","A选项":"A. 生物多样性保护工作协调机制","B选项":"B. 生物多样性调查制度","C选项":"C. 生物多样性监测制度","D选项":"D. 生物多样性评估和保护制度","正确答案":"A、B、C、D"},{"题号":"题1241","题干":"根据《中华人民共和国生态环境法典》，国家对严重污染环境、破坏生态等的技术、工艺、设备、材料、产品实行淘汰制度。关于该制度，下列说法正确的有（ ）。","A选项":"A. 国务院发展改革部门会同有关部门确定淘汰期限并纳入国家综合性产业政策目录","B选项":"B. 生产者、进口者、销售者、使用者应当在规定期限内停止生产、进口、销售、使用列入目录的设备、材料、产品","C选项":"C. 技术、工艺的采用者应当在规定期限内停止采用列入目录的技术、工艺","D选项":"D. 被淘汰的设备、材料、产品不得转让给他人使用","正确答案":"A、B、C、D"},{"题号":"题1242","题干":"根据《中华人民共和国生态环境法典》，负有生态环境保护监督管理职责的部门有权依法对下列哪些主体进行现场检查（ ）。","A选项":"A. 污染环境、破坏生态等的企业事业单位","B选项":"B. 其他生产经营者","C选项":"C. 生态环境技术服务机构","D选项":"D. 普通居民个人","正确答案":"A、B、C"},{"题号":"题1243","题干":"根据《中华人民共和国生态环境法典》，企业事业单位和其他生产经营者违反法律法规规定，造成或者可能造成严重污染环境、破坏生态等后果，或者有关证据可能灭失、被隐匿的，负有生态环境保护监督管理职责的部门可以依法查封、扣押（ ）。","A选项":"A. 有关场所","B选项":"B. 船舶、设施、设备","C选项":"C. 工具、物品","D选项":"D. 企业银行账户","正确答案":"A、B、C"},{"题号":"题1244","题干":"根据《中华人民共和国生态环境法典》，生态环境分区管控方案应当落实生态保护红线、环境质量底线、资源利用上线目标，划定优先保护、重点管控、一般管控单元，明确相应的生态环境准入清单。关于生态环境分区管控，下列说法正确的有（ ）。","A选项":"A. 设区的市级以上地方人民政府制定和调整分区管控方案","B选项":"B. 分区管控方案报上一级人民政府生态环境主管部门备案后公布实施","C选项":"C. 分区管控方案应当与国土空间规划相衔接","D选项":"D. 禁止违反生态环境准入清单规定进行生产建设活动","正确答案":"A、B、C、D"},{"题号":"题1245","题干":"根据《中华人民共和国生态环境法典》，关于生态环境质量标准，下列说法正确的有（ ）。","A选项":"A. 国务院生态环境主管部门制定国家生态环境质量标准","B选项":"B. 省级人民政府对国家生态环境质量标准中未作规定的项目，可以制定地方生态环境质量标准","C选项":"C. 省级人民政府对国家生态环境质量标准中已作规定的项目，可以制定严于国家生态环境质量标准的地方生态环境质量标准","D选项":"D. 地方生态环境质量标准应当报国务院生态环境主管部门备案","正确答案":"A、B、C、D"},{"题号":"题1246","题干":"根据《中华人民共和国生态环境法典》，生态环境监测机构、实行排污许可管理和其他负有法定监测义务的企业事业单位应当依法建立健全监测数据质量管理制度。前款规定的监测机构和企业事业单位及其负责人应当对监测数据的（ ）负责。","A选项":"A. 真实性","B选项":"B. 准确性","C选项":"C. 完整性","D选项":"D. 商业性","正确答案":"A、B、C"},{"题号":"题1247","题干":"根据《中华人民共和国生态环境法典》，关于生态环境影响评价，下列说法正确的有（ ）。","A选项":"A. 评价对象包括规划和建设项目","B选项":"B. 评价内容包括对实施后可能造成的生态环境影响进行分析、预测和评估","C选项":"C. 评价内容包括提出预防或者减轻不良生态环境影响的对策和措施","D选项":"D. 评价制度包括进行跟踪监测","正确答案":"A、B、C、D"},{"题号":"题1248","题干":"根据《中华人民共和国生态环境法典》，建设项目的生态环境影响报告书应当包括下列哪些内容（ ）。","A选项":"A. 建设项目概况","B选项":"B. 建设项目周围生态环境现状","C选项":"C. 建设项目对生态环境可能造成影响的分析、预测和评估","D选项":"D. 建设项目生态环境保护措施及其技术、经济论证","正确答案":"A、B、C、D"},{"题号":"题1249","题干":"根据《中华人民共和国生态环境法典》，生态环境主管部门应当对建设项目生态环境影响报告书、生态环境影响报告表作出不予批准决定的情形包括（ ）。","A选项":"A. 建设项目类型及其选址、布局、规模等不符合生态环境法律法规规定和相关法定规划","B选项":"B. 所在区域、流域、海域生态环境质量未达到生态环境质量标准，且建设项目拟采取的措施不能满足生态环境质量改善目标管理要求","C选项":"C. 建设项目采取的污染防治措施无法确保污染物排放达到排放标准，或者未采取必要措施预防和控制生态破坏","D选项":"D. 建设项目的生态环境影响报告书、生态环境影响报告表存在基础资料明显不实，内容存在重大缺陷、遗漏或者虚假，生态环境影响评价结论不正确或者不合理等严重质量问题","正确答案":"A、B、C、D"},{"题号":"题1250","题干":"根据《中华人民共和国生态环境法典》，生态保护补偿可以采取的方式包括（ ）。","A选项":"A. 资金补偿","B选项":"B. 对口协作、产业转移","C选项":"C. 人才培训、共建园区","D选项":"D. 购买生态产品和服务","正确答案":"A、B、C、D"},{"题号":"题1251","题干":"根据《中华人民共和国生态环境法典》，突发生态环境事件按照社会危害程度、影响范围等因素分为（ ）。","A选项":"A. 特别重大","B选项":"B. 重大","C选项":"C. 较大","D选项":"D. 一般","正确答案":"A、B、C、D"},{"题号":"题1252","题干":"根据《中华人民共和国生态环境法典》，企业事业单位和其他生产经营者应当依法完善突发生态环境事件风险防控措施，并履行下列哪些义务（ ）。","A选项":"A. 开展隐患排查，及时消除隐患","B选项":"B. 按照国家规定储备必要的生态环境应急物资和装备","C选项":"C. 定期开展应急演练","D选项":"D. 发生或者可能发生突发生态环境事件时立即采取措施处理，切断或者控制污染源","正确答案":"A、B、C、D"},{"题号":"题1253","题干":"根据《中华人民共和国生态环境法典》，关于突发生态环境事件应急预案，下列说法正确的有（ ）。","A选项":"A. 国务院组织制定国家突发生态环境事件应急预案并组织实施","B选项":"B. 县级以上地方人民政府应当制定本行政区域的突发生态环境事件应急预案并按照规定备案","C选项":"C. 企业事业单位和其他生产经营者应当按照国家规定制定突发生态环境事件应急预案","D选项":"D. 企业事业单位应急预案应当报生态环境等有关部门备案","正确答案":"A、B、C、D"},{"题号":"题1254","题干":"根据《中华人民共和国生态环境法典》，国家采取有利于保护生态环境的财政、税收、价格、采购、金融、产业等政策和措施。下列属于保障措施内容的有（ ）。","A选项":"A. 将生态环境保护工作所需经费纳入本级政府预算","B选项":"B. 对参与生态环境保护的单位和个人依法给予税收优惠","C选项":"C. 推动绿色信贷、绿色债券、绿色保险、绿色信托等绿色金融产品和服务规范健康发展","D选项":"D. 推动建立资源环境要素市场交易制度","正确答案":"A、B、C、D"},{"题号":"题1255","题干":"根据《中华人民共和国生态环境法典》，负有生态环境保护监督管理职责的部门应当依法公开下列哪些信息（ ）。","A选项":"A. 生态环境质量","B选项":"B. 生态环境监测","C选项":"C. 突发生态环境事件","D选项":"D. 生态环境行政许可、行政处罚","正确答案":"A、B、C、D"},{"题号":"题1256","题干":"根据《中华人民共和国生态环境法典》，符合下列哪些条件的社会组织可以依法向人民法院提起民事公益诉讼（ ）。","A选项":"A. 依法在设区的市级以上人民政府民政部门登记","B选项":"B. 专门从事生态环境保护公益活动连续五年以上","C选项":"C. 无违法记录","D选项":"D. 注册资本达到一千万元","正确答案":"A、B、C"},{"题号":"题1257","题干":"根据《中华人民共和国生态环境法典》，污染防治坚持的方针包括（ ）。","A选项":"A. 精准治污","B选项":"B. 科学治污","C选项":"C. 依法治污","D选项":"D. 先污染后治理","正确答案":"A、B、C"},{"题号":"题1258","题干":"根据《中华人民共和国生态环境法典》，排放污染物，应当符合下列哪些要求（ ）。","A选项":"A. 污染物排放标准","B选项":"B. 重点污染物排放总量控制指标","C选项":"C. 排污许可管理要求","D选项":"D. 有关法律、法规、规章的要求","正确答案":"A、B、C、D"},{"题号":"题1259","题干":"根据《中华人民共和国生态环境法典》，关于污染物排放标准，下列说法正确的有（ ）。","A选项":"A. 国务院生态环境主管部门制定国家污染物排放标准","B选项":"B. 省级人民政府对国家污染物排放标准中未作规定的项目，可以制定地方污染物排放标准","C选项":"C. 省级人民政府对国家污染物排放标准中已作规定的项目，可以制定严于国家污染物排放标准的地方污染物排放标准","D选项":"D. 地方污染物排放标准应当报国务院生态环境主管部门备案","正确答案":"A、B、C、D"},{"题号":"题1260","题干":"根据《中华人民共和国生态环境法典》，对超过重点污染物排放总量控制指标或者未完成生态环境质量目标的地区，省级以上人民政府生态环境主管部门应当暂停审批该地区新增重点污染物排放总量的建设项目的生态环境影响报告书、生态环境影响报告表。该措施的目的包括（ ）。","A选项":"A. 控制重点污染物排放总量","B选项":"B. 督促地方完成生态环境质量目标","C选项":"C. 限制新增排放总量的建设项目","D选项":"D. 免除该地区已有企业的治理责任","正确答案":"A、B、C"},{"题号":"题1261","题干":"根据《中华人民共和国生态环境法典》，企业事业单位和其他生产经营者排放污染物的，应当依照法律法规和国务院生态环境主管部门的规定设置、使用污染物排放口。禁止通过下列哪些逃避监管的方式排放污染物（ ）。","A选项":"A. 暗管、渗井、渗坑、灌注","B选项":"B. 裂隙、溶洞","C选项":"C. 篡改或者伪造监测数据","D选项":"D. 不正常运行污染防治设施","正确答案":"A、B、C、D"},{"题号":"题1262","题干":"根据《中华人民共和国生态环境法典》，关于排污许可分类管理，下列说法正确的有（ ）。","A选项":"A. 污染物产生量、排放量或者对生态环境的影响程度较大的，实行排污许可重点管理","B选项":"B. 污染物产生量、排放量和对生态环境的影响程度都较小的，实行排污许可简化管理","C选项":"C. 实行排污许可管理的范围、实施步骤和管理类别名录由国务院生态环境主管部门拟订并报国务院批准后公布实施","D选项":"D. 制定管理类别名录应当征求有关部门、行业协会、企业事业单位和公众等方面的意见","正确答案":"A、B、C、D"},{"题号":"题1263","题干":"根据《中华人民共和国生态环境法典》，下列哪些企业事业单位和其他生产经营者应当取得排污许可证（ ）。","A选项":"A. 排放工业废气或者有毒有害大气污染物的企业事业单位和集中供热设施的燃煤热源生产运营单位","B选项":"B. 直接或者间接向水体排放工业废水、医疗污水的企业事业单位和其他生产经营者","C选项":"C. 城镇污水集中处理设施的运营单位","D选项":"D. 产生工业固体废物的单位","正确答案":"A、B、C、D"},{"题号":"题1264","题干":"根据《中华人民共和国生态环境法典》，对具备下列哪些条件的实行排污许可管理的企业事业单位和其他生产经营者，颁发排污许可证（ ）。","A选项":"A. 依法取得生态环境影响报告书、生态环境影响报告表批准文件，或者已经办理生态环境影响登记表备案手续","B选项":"B. 污染物排放符合污染物排放标准等要求，重点污染物排放符合相关技术规范、批准文件以及重点污染物排放总量控制指标要求","C选项":"C. 采用污染防治设施可以达到许可排放浓度等要求或者符合污染防治可行技术","D选项":"D. 自行监测方案的监测点位、指标、频次等符合国家自行监测规范","正确答案":"A、B、C、D"},{"题号":"题1265","题干":"根据《中华人民共和国生态环境法典》，实行排污许可管理的企业事业单位和其他生产经营者在排污许可证有效期内，有下列哪些情形之一的，应当重新取得排污许可证（ ）。","A选项":"A. 新建、改建、扩建排放污染物的项目","B选项":"B. 生产经营场所、排污口位置或者污染物排放方式、排放去向发生变化","C选项":"C. 排污口数量或者污染物排放种类、排放浓度、排放量增加","D选项":"D. 企业法定代表人变更","正确答案":"A、B、C"},{"题号":"题1266","题干":"根据《中华人民共和国生态环境法典》，关于大气污染防治，防治大气污染应当加强对下列哪些大气污染的综合防治（ ）。","A选项":"A. 燃煤、工业","B选项":"B. 机动车船、非道路移动机械","C选项":"C. 扬尘、农业","D选项":"D. 生活污水","正确答案":"A、B、C"},{"题号":"题1267","题干":"根据《中华人民共和国生态环境法典》，固体废物污染防治坚持减量化、资源化和无害化的原则，加强产生、收集、贮存、运输、利用、处置等全过程管控。下列属于固体废物污染防治原则的有（ ）。","A选项":"A. 减量化","B选项":"B. 资源化","C选项":"C. 无害化","D选项":"D. 随意化","正确答案":"A、B、C"},{"题号":"题1268","题干":"根据《中华人民共和国生态环境法典》，关于生态环境损害赔偿，下列说法正确的有（ ）。","A选项":"A. 违反法律规定，污染环境、破坏生态等给国家造成损失的，由设区的市级以上地方人民政府或者其指定的部门、机构与责任人按照有关规定进行磋商","B选项":"B. 磋商未达成一致的，设区的市级以上地方人民政府或者其指定的部门、机构可以向人民法院提起诉讼","C选项":"C. 前项地方人民政府、部门、机构不进行磋商，或者磋商未达成一致且不提起诉讼的，人民检察院可以对责任人依法向人民法院提起诉讼","D选项":"D. 污染海洋环境、破坏海洋生态给国家造成损失的，由生态环境主管部门提出损害赔偿要求，并可以直接向人民法院提起诉讼","正确答案":"A、B、C"},{"题号":"题1269","题干":"根据《中华人民共和国生态环境法典》，建设项目的生态环境影响评价实行分类管理，建设单位应当按照规定组织编制（ ）。","A选项":"A. 生态环境影响报告书","B选项":"B. 生态环境影响报告表","C选项":"C. 填报生态环境影响登记表","D选项":"D. 生态环境影响承诺书","正确答案":"A、B、C"},{"题号":"题1270","题干":"根据《中华人民共和国生态环境法典》，国务院生态环境主管部门负责审批的建设项目生态环境影响报告书、报告表包括（ ）。","A选项":"A. 核设施等特殊性质的建设项目","B选项 C. 全面推进美丽中国建设，实现中华民族永续发展","D选项":"D. 以经济效益优先，兼顾环境保护","正确答案":"A、B、C"},{"题号":"题1503","题干":"关于法典中“生态环境”的定义，下列哪些属于其涵盖的范围？","A选项":"A. 大气、水、海洋、土地、矿藏","B选项":"B. 森林、草原、湿地、冰川、高原、荒漠","C选项":"C. 野生生物、自然遗迹、人文遗迹","D选项":"D. 自然保护地、城市和乡村","正确答案":"A、B、C、D"},{"题号":"题1504","题干":"关于法典规定的监督管理体制，下列哪些说法是正确的？","A选项":"A. 国务院生态环境主管部门对全国生态环境保护工作实施统一监督管理","B选项":"B. 地方人民政府对本行政区域的生态环境保护工作和生态环境质量负责","C选项":"C. 国家建立健全生态环境保护督察制度，实行中央和省两级督察体制","D选项":"D. 生态环境执法完全由公安机关负责","正确答案":"A、B、C"},{"题号":"题1505","题干":"关于生态保护补偿制度，法典规定的补偿方式包括：","A选项":"A. 财政纵向补偿","B选项":"B. 地区间横向补偿","C选项":"C. 市场机制补偿","D选项":"D. 仅以资金补偿为唯一方式","正确答案":"A、B、C"},{"题号":"题1506","题干":"关于生态环境分区管控，下列哪些属于法典规定的内容？","A选项":"A. 落实生态保护红线、环境质量底线、资源利用上线目标","B选项":"B. 划定优先保护、重点管控、一般管控单元","C选项":"C. 明确相应的生态环境准入清单","D选项":"D. 禁止违反生态环境准入清单规定进行生产建设活动","正确答案":"A、B、C、D"},{"题号":"题1507","题干":"关于生态环境监测，下列哪些弄虚作假的行为被法典明确禁止？","A选项":"A. 干扰采样、调换样品、改变监测条件","B选项":"B. 虚假监测、篡改或者伪造记录","C选项":"C. 侵占、损毁或者擅自移动监测设施设备","D选项":"D. 使用未经校准的监测设备但未造成数据失真","正确答案":"A、B、C"},{"题号":"题1508","题干":"关于生态环境影响评价，下列哪些表述是正确的？","A选项":"A. 未依法进行生态环境影响评价的建设项目，不得开工建设","B选项":"B. 生态环境影响评价应当客观、公开、公正","C选项":"C. 国家鼓励有关单位、专家和公众依法参与生态环境影响评价","D选项":"D. 所有建设项目均应编制生态环境影响报告书","正确答案":"A、B、C"},{"题号":"题1509","题干":"关于生态环境信息公开、公众参与和公益诉讼，下列说法正确的有（ ）。","A选项":"A. 公民、法人和其他组织依法享有获取生态环境信息的权利","B选项":"B. 公民、法人和其他组织依法享有参与和监督生态环境保护的权利","C选项":"C. 公民、法人和其他组织发现污染环境、破坏生态等行为，有权依法举报","D选项":"D. 符合条件的社会组织可以依法提起环境民事公益诉讼","正确答案":"A、B、C、D"},{"题号":"题1510","题干":"关于排污许可管理，下列哪些说法正确？","A选项":"A. 国家建立健全以排污许可制为核心的固定污染源监督管理制度","B选项":"B. 未取得排污许可证的不得排放污染物","C选项":"C. 排污许可分类管理包括重点管理和简化管理","D选项":"D. 所有企业均需取得排污许可证","正确答案":"A、B、C"},{"题号":"题1511","题干":"关于大气污染防治，下列哪些属于法典规定的防治措施？","A选项":"A. 燃煤和其他能源大气污染防治","B选项":"B. 工业大气污染防治","C选项":"C. 机动车船等大气污染防治","D选项":"D. 仅治理工业污染","正确答案":"A、B、C"},{"题号":"题1512","题干":"关于重污染天气应对，法典规定的应对措施包括：","A选项":"A. 责令有关企业停产或者限产","B选项":"B. 限制部分机动车行驶和非道路移动机械使用","C选项":"C. 停止工地土石方作业和建筑物拆除施工","D选项":"D. 一律采取全面停产措施","正确答案":"A、B、C"},{"题号":"题1513","题干":"关于水污染防治，下列哪些属于法典规定的禁止行为？","A选项":"A. 向水体排放油类、酸液、碱液、剧毒废液","B选项":"B. 在水体清洗装贮过油类或者有毒有害污染物的车辆和容器","C选项":"C. 向水体排放、倾倒放射性固体废物或者含有高放射性和中放射性物质的废水","D选项":"D. 向水体排放符合标准的低放射性废水","正确答案":"A、B、C"},{"题号":"题1514","题干":"关于饮用水水源保护区，下列哪些行为被禁止？","A选项":"A. 在保护区内设置排污口","B选项":"B. 在一级保护区内新建、改建、扩建与供水设施和保护水源无关的建设项目","C选项":"C. 在一级保护区内从事网箱养殖、旅游、游泳、垂钓","D选项":"D. 在二级保护区内新建、改建、扩建排放污染物的建设项目","正确答案":"A、B、C、D"},{"题号":"题1515","题干":"关于海洋污染防治，下列哪些属于法典新增的“陆海一体化”制度内容？","A选项":"A. 入海排污口设置需向生态环境主管部门备案","B选项":"B. 建立近岸海域、入海排污口、排污管线、污染源全链条治理体系","C选项":"C. 加强入海河流管理，协同推进入海河流污染防治","D选项":"D. 海洋污染防治完全独立于陆地污染防治","正确答案":"A、B、C"},{"题号":"题1516","题干":"关于土壤污染防治，下列哪些属于法典规定的风险管控和修复活动？","A选项":"A. 土壤污染状况调查","B选项":"B. 土壤污染风险评估","C选项":"C. 风险管控、修复","D选项":"D. 仅对建设用地进行修复","正确答案":"A、B、C"},{"题号":"题1517","题干":"关于农用地分类管理制度，下列哪些类别属于法典规定的分类？","A选项":"A. 优先保护类","B选项":"B. 安全利用类","C选项":"C. 严格管控类","D选项":"D. 自由开发类","正确答案":"A、B、C"},{"题号":"题1518","题干":"关于固体废物污染防治的“三化”原则，包括：","A选项":"A. 减量化","B选项":"B. 资源化","C选项":"C. 无害化","D选项":"D. 产业化","正确答案":"A、B、C"},{"题号":"题1519","题干":"关于危险废物管理，下列哪些行为被法典明确禁止？","A选项":"A. 无许可证从事危险废物经营活动","B选项":"B. 将危险废物混入非危险废物中贮存","C选项":"C. 混合收集、贮存、运输、处置性质不相容的危险废物","D选项":"D. 在危险废物包装上设置识别标志","正确答案":"A、B、C"},{"题号":"题1520","题干":"关于生活垃圾分类，下列哪些属于法典规定的义务或措施？","A选项":"A. 产生生活垃圾的单位、家庭和个人依法履行源头减量和分类投放义务","B选项":"B. 禁止随意倾倒、堆放、丢弃、抛撒、遗撒或者焚烧生活垃圾","C选项":"C. 机关、事业单位应当在生活垃圾分类工作中起示范带头作用","D选项":"D. 生活垃圾可以混合运输","正确答案":"A、B、C"},{"题号":"题1521","题干":"关于噪声污染防治，下列哪些属于法典规定的噪声分类？","A选项":"A. 工业噪声","B选项":"B. 建筑施工噪声","C选项":"C. 交通运输噪声","D选项":"D. 仅社会生活噪声","正确答案":"A、B、C"},{"题号":"题1522","题干":"关于建筑施工噪声污染防治，下列哪些规定是正确的？","A选项":"A. 建设单位应将噪声污染防治费用列入工程造价","B选项":"B. 施工单位应制定噪声污染防治实施方案","C选项":"C. 在噪声敏感建筑物集中区域禁止夜间施工（除抢修抢险等特殊情形）","D选项":"D. 任何情况下都不得夜间施工","正确答案":"A、B、C"},{"题号":"题1523","题干":"关于放射性污染防治，下列哪些属于法典规定的放射性废物处置原则？","A选项":"A. 低、中水平放射性固体废物实行近地表处置或者中等深度处置","B选项":"B. 高水平放射性固体废物实行集中的深地质处置","C选项":"C. 禁止在内河水域和海上处置放射性固体废物","D选项":"D. 可以随意处置放射性废物","正确答案":"A、B、C"},{"题号":"题1524","题干":"关于化学物质污染风险管控，法典规定的新污染物协同治理和环境风险管控体系包括：","A选项":"A. 建立持久性有机污染物等新污染物协同治理机制","B选项":"B. 分析研判新污染物环境风险管控形势","C选项":"C. 制定完善相关标准，组织开展调查监测","D选项":"D. 不设任何管控措施","正确答案":"A、B、C"},{"题号":"题1525","题干":"关于电磁辐射污染防治，下列哪些属于法典规定的分类管理内容？","A选项":"A. 将电磁辐射设施分为一类、二类、三类","B选项":"B. 一类、二类电磁辐射设施需开展自行监测","C选项":"C. 一类电磁辐射设施应避让人口密集区域","D选项":"D. 所有电磁辐射设施均无需管理","正确答案":"A、B、C"},{"题号":"题1526","题干":"关于光污染防治，下列哪些属于法典规定的管理措施？","A选项":"A. 对广告屏、道路、施工场地的照明设施进行规范","B选项":"B. 建筑物外表面采用玻璃幕墙需符合国家规定","C选项":"C. 实行光污染防治分区管理","D选项":"D. 光污染无需任何限制","正确答案":"A、B、C"},{"题号":"题1527","题干":"关于海洋倾倒废弃物，下列哪些行为被法典禁止？","A选项":"A. 任何个人和未经批准的单位向管辖海域倾倒废弃物","B选项":"B. 境外废弃物在中华人民共和国管辖海域倾倒","C选项":"C. 海上焚烧废弃物","D选项":"D. 取得倾倒许可证后按许可条件倾倒","正确答案":"A、B、C"},{"题号":"题1528","题干":"关于船舶海洋污染防治，下列哪些属于法典规定的义务？","A选项":"A. 船舶应配备相应的防污设备和器材","B选项":"B. 船舶应持有防治海洋环境污染的证书与文书","C选项":"C. 船舶进行涉及污染物排放的操作应如实记录并保存","D选项":"D. 船舶可以任意排放压载水","正确答案":"A、B、C"},{"题号":"题1529","题干":"关于畜禽养殖污染防治，下列哪些属于法典规定的要求？","A选项":"A. 畜禽养殖场应当提高精准饲喂水平，加强畜禽粪污综合管理","B选项":"B. 及时对畜禽粪污、尸体等废弃物进行收集、贮存、清运、无害化处理和资源化利用","C选项":"C. 禁止将不符合农用标准和生态环境保护标准的固体废物、废水施入农田","D选项":"D. 畜禽粪污可以直接排入农田","正确答案":"A、B、C"},{"题号":"题1530","题干":"关于生态系统保护，法典规定的主要生态系统类型包括：","A选项":"A. 森林、草原","B选项":"B. 湿地、海洋、海岛","C选项":"C. 江河湖泊、荒漠","D选项":"D. 仅森林和草原","正确答案":"A、B、C"},{"题号":"题1531","题干":"关于自然保护地体系，法典规定的分级分类包括：","A选项":"A. 国家公园","B选项":"B. 自然保护区","C选项":"C. 自然公园","D选项":"D. 仅国家公园","正确答案":"A、B、C"},{"题号":"题1532","题干":"关于生物多样性保护，法典规定的措施包括：","A选项":"A. 建立健全生物多样性调查、监测、评估和保护制度","B选项":"B. 合理布局建设生物多样性保护空间体系","C选项":"C. 对引进外来物种采取有效措施防止对生物多样性的破坏","D选项":"D. 不设任何保护措施","正确答案":"A、B、C"},{"题号":"题1533","题干":"关于长江、黄河等重要流域的保护，法典规定的制度包括：","A选项":"A. 建立流域水生态环境联合保护协调机制","B选项":"B. 禁止在流域重点生态功能区布局对生态系统有严重影响的产业","C选项":"C. 实行水沙统一调度制度（黄河）","D选项":"D. 可以随意开发流域资源","正确答案":"A、B、C"},{"题号":"题1534","题干":"关于水土保持，下列哪些行为被法典禁止或限制？","A选项":"A. 在崩塌、滑坡危险区和泥石流易发区从事取土、挖砂、采石","B选项":"B. 在二十五度以上陡坡地开垦种植农作物","C选项":"C. 毁林、毁草开垦和采集发菜","D选项":"D. 在合法区域开展水土保持工程建设","正确答案":"A、B、C"},{"题号":"题1535","题干":"关于防沙治沙，下列哪些属于法典规定的措施？","A选项":"A. 建立沙化土地封禁保护区","B选项":"B. 禁止在沙化土地上砍挖灌木、药材及其他固沙植物","C选项":"C. 鼓励单位和个人开展公益性的治沙活动","D选项":"D. 允许随意开垦沙化土地","正确答案":"A、B、C"},{"题号":"题1536","题干":"关于生态修复，法典规定的原则和机制包括：","A选项":"A. 建立健全源头保护和全过程修复治理相结合的工作机制","B选项":"B. 坚持自然恢复为主、自然恢复与人工修复相结合","C选项":"C. 建立生态修复成效评估机制","D选项":"D. 生态修复无需任何规划","正确答案":"A、B、C"},{"题号":"题1537","题干":"关于湿地保护，下列哪些行为被法典明确禁止？","A选项":"A. 开（围）垦、排干自然湿地","B选项":"B. 擅自填埋自然湿地，擅自采砂、采矿、取土","C选项":"C. 排放不符合标准的工业废水、生活污水","D选项":"D. 在湿地内开展科学研究","正确答案":"A、B、C"},{"题号":"题1538","题干":"关于海洋和海岛保护，下列哪些属于法典规定的内容？","A选项":"A. 严格保护海洋自然岸线","B选项":"B. 禁止违法占用、损害自然岸线","C选项":"C. 未经批准利用的无居民海岛应当维持现状","D选项":"D. 可以随意改变无居民海岛","正确答案":"A、B、C"},{"题号":"题1539","题干":"关于野生动植物保护，下列哪些行为需要依法取得许可？","A选项":"A. 猎捕国家重点保护野生动物","B选项":"B. 采集国家一级保护野生植物","C选项":"C. 出口国家重点保护野生植物及其制品","D选项":"D. 普通公民捡拾掉落的树叶","正确答案":"A、B、C"},{"题号":"题1540","题干":"关于外来入侵物种防控，下列哪些属于法典规定的禁止行为？","A选项":"A. 擅自引进外来物种","B选项":"B. 擅自释放或者丢弃外来物种","C选项":"C. 未经审批从境外引进农作物种子苗木","D选项":"D. 依法进口并检疫合格的动植物","正确答案":"A、B、C"},{"题号":"题1541","题干":"关于国家公园，下列哪些规定是正确的？","A选项":"A. 国家公园划分为核心保护区和一般控制区","B选项":"B. 核心保护区实行严格保护","C选项":"C. 一般控制区可以开展相关公共服务活动","D选项":"D. 国家公园内可以任意开发旅游项目","正确答案":"A、B、C"},{"题号":"题1542","题干":"关于青藏高原生态保护，下列哪些属于法典规定的重点保护对象？","A选项":"A. 雪山冰川冻土","B选项":"B. 江河湖泊源头","C选项":"C. 珍贵、濒危或者特有野生动植物物种","D选项":"D. 仅保护城市区域","正确答案":"A、B、C"},{"题号":"题1543","题干":"关于森林保护，下列哪些行为被法典禁止？","A选项":"A. 毁林开垦、采石、采砂、采土","B选项":"B. 在幼林地砍柴、毁苗、放牧","C选项":"C. 擅自移动或者损坏森林保护标志","D选项":"D. 依法抚育和更新性质的采伐","正确答案":"A、B、C"},{"题号":"题1544","题干":"关于草原保护，下列哪些属于法典规定的制度（ ）。","A选项":"A. 基本草原保护制度","B选项":"B. 以草定畜、草畜平衡制度","C选项":"C. 禁牧、休牧制度","D选项":"D. 允许超载过牧","正确答案":"A、B、C"},{"题号":"题1545","题干":"关于循环经济，法典规定的“三化”原则包括：","A选项":"A. 减量化","B选项":"B. 再利用","C选项":"C. 资源化","D选项":"D. 产业化","正确答案":"A、B、C"},{"题号":"题1546","题干":"关于清洁生产，下列哪些属于法典规定的强制性清洁生产审核情形？","A选项":"A. 污染物排放超过国家或者地方规定的排放标准","B选项":"B. 超过重点污染物排放总量控制指标","C选项":"C. 使用有毒有害原料进行生产或者在生产中排放有毒有害物质","D选项":"D. 企业自愿申请","正确答案":"A、B、C"},{"题号":"题1547","题干":"关于产品包装，法典规定的禁止或限制措施包括：","A选项":"A. 防止过度包装，遵守限制商品过度包装的强制性标准","B选项":"B. 电子商务、快递、外卖等行业应当减少包装物的使用","C选项":"C. 优先采用可重复使用、易回收利用的包装物","D选项":"D. 可以任意使用不可降解塑料袋","正确答案":"A、B、C"},{"题号":"题1548","题干":"关于应对气候变化，法典规定的减缓措施包括：","A选项":"A. 实施碳排放总量和强度控制制度","B选项":"B. 建立全国碳排放权交易市场","C选项":"C. 建立全国温室气体自愿减排交易市场","D选项":"D. 不设任何减排义务","正确答案":"A、B、C"},{"题号":"题1549","题干":"关于碳排放权交易，下列哪些规定是正确的？","A选项":"A. 纳入重点排放单位应当按照国家规定履行强制减排责任","B选项":"B. 碳排放权交易产品包括碳排放配额和经批准的其他现货交易产品","C选项":"C. 重点排放单位应当按照国家有关规定及时足额清缴碳排放配额","D选项":"D. 任何单位无需清缴配额","正确答案":"A、B、C"},{"题号":"题1550","题干":"关于适应气候变化，法典规定的措施包括：","A选项":"A. 制定实施适应气候变化战略","B选项":"B. 加强对多灾种、灾害链风险综合预警和评估","C选项":"C. 加强极端天气气候事件下综合救援和公众安全保障","D选项":"D. 无需任何适应措施","正确答案":"A、B、C"},{"题号":"题1551","题干":"关于能源绿色低碳转型，法典规定的措施包括：","A选项":"A. 支持优先开发利用可再生能源","B选项":"B. 推进非化石能源安全可靠有序替代化石能源","C选项":"C. 建立健全煤炭清洁高效利用机制","D选项":"D. 放弃化石能源利用","正确答案":"A、B、C"},{"题号":"题1552","题干":"关于绿色消费，法典规定的措施包括：","A选项":"A. 建立健全绿色消费激励机制","B选项":"B. 推行政府绿色采购制度","C选项":"C. 鼓励、支持二手商品流通交易","D选项":"D. 限制所有一次性用品","正确答案":"A、B、C"},{"题号":"题1553","题干":"关于碳足迹管理，下列哪些属于法典规定的内容？","A选项":"A. 建立产品碳足迹核算标准和技术规范","B选项":"B. 建立产品碳足迹分级管理、标识认证和信息披露制度","C选项":"C. 企业如实报送排放数据上升为法律义务","D选项":"D. 碳足迹管理仅适用于进出口产品","正确答案":"A、B、C"},{"题号":"题1554","题干":"关于法律责任的确定原则，下列哪些属于法典规定的内容？","A选项":"A. 应当与违法行为的事实、性质、情节、危害后果相当（过罚相当）","B选项":"B. 有恶意损害生态环境等情形的，依法从重处罚","C选项":"C. 主动消除或者减轻危害后果的，依法从轻或者减轻处罚","D选项":"D. 无论情节轻重一律顶格处罚","正确答案":"A、B、C"},{"题号":"题1555","题干":"关于按日连续处罚制度，下列哪些说法正确？","A选项":"A. 违法排放污染物受到罚款处罚，被责令改正后拒不改正的，可以按日连续处罚","B选项":"B. 按日连续处罚从责令改正之日的次日起计算","C选项":"C. 地方性法规可以根据实际需要增加按日连续处罚的违法行为种类","D选项":"D. 按日连续处罚仅适用于大气污染","正确答案":"A、B、C"},{"题号":"题1556","题干":"关于生态环境损害赔偿和公益诉讼，下列哪些属于法典规定的诉讼主体？","A选项":"A. 设区的市级以上地方人民政府或其指定的部门、机构","B选项":"B. 人民检察院","C选项":"C. 符合条件的社会组织","D选项":"D. 任何个人","正确答案":"A、B、C"},{"题号":"题1557","题干":"关于未批先建的行政处罚，下列哪些规定是正确的？","A选项":"A. 未依法报批环评文件擅自开工建设的，责令停止建设并可以责令恢复原状","B选项":"B. 环评报告书项目处20万元以上100万元以下罚款，情节严重的处100万元以上1000万元以下","C选项":"C. 环评报告表项目处10万元以上50万元以下罚款，情节严重的处50万元以上500万元以下","D选项":"D. 未批先建行为不承担任何法律责任","正确答案":"A、B、C"},{"题号":"题1558","题干":"关于新旧法律衔接，下列哪些说法正确？","A选项":"A. 法典自2026年8月15日起施行","B选项":"B. 法典施行后，《环境保护法》等10部法律同时废止","C选项":"C. 其他法律对生态保护、绿色低碳发展等有具体规定的，适用其规定","D选项":"D. 所有原有法律全部废止","正确答案":"A、B、C"},{"题号":"题1559","题干":"依据《生态环境法典》，企业事业单位和其他生产经营者应当履行（ ）。","A选项":"A.采取有效措施防止、减少环境污染和生态破坏","B选项":"B.节约集约利用资源，控制温室气体排放","C选项":"C.落实绿色低碳相关生产经营义务","D选项":"D.对自身造成的环境损害依法承担责任","正确答案":"A、B、C、D"},{"题号":"题1560","题干":"企业开展生产建设活动，生态环境影响评价相关法定要求有（ ）。","A选项":"A.新建项目未完成环评不得开工建设","B选项":"B.项目性质、规模重大变动需重新报批环评","C选项":"C.环评批复超五年未开工，需重新审核","D选项":"D.环评文件可委托具备资质单位编制","正确答案":"A、B、C、D"},{"题号":"题1561","题干":"排污许可制度适用的生产经营主体包含（ ）。","A选项":"A.排放工业废气的生产企业","B选项":"B.城镇污水集中处理运营单位","C选项":"C.产生工业固体废物的加工厂","D选项":"D.排放工业噪声的制造企业","正确答案":"A、B、C、D"},{"题号":"题1562","题干":"排污许可证应当载明的内容有（ ）。","A选项":"A.排污口位置、数量、排放去向","B选项":"B.污染物排放种类、许可浓度、许可排放量","C选项":"C.配套污染防治设施运维要求","D选项":"D.特殊时段限排、禁排要求","正确答案":"A、B、C、D"},{"题号":"题1563","题干":"取得排污许可证企业日常管理要求包括（ ）。","A选项":"A.按规范开展自行监测，留存原始记录不少于5年","B选项":"B.建立环保管理台账，完整记录排污、治污设施运行情况","C选项":"C.重点排污单位安装自动监测设备并联网监管平台","D选项":"D.依法向社会公开污染物排放相关数据","正确答案":"A、B、C、D"},{"题号":"题1564","题干":"企业存在哪些情形，应当重新申领排污许可证（ ）。","A选项":"A.新建、改建、扩建排污生产项目","B选项":"B.生产经营场所整体搬迁","C选项":"C.排污口数量大幅增加","D选项":"D.污染物排放种类新增有毒物质","正确答案":"A、B、C、D"},{"题号":"题1565","题干":"下列属于法律明令禁止的逃避监管排污行为有（ ）。","A选项":"A.私设暗管排放废水废气","B选项":"B.篡改、伪造自动监测数据","C选项":"C.不正常运行废气、废水治理设施","D选项":"D.非紧急情况开启应急通道直排污染物","正确答案":"A、B、C、D"},{"题号":"题1566","题干":"建设项目环保“三同时”制度指（ ）。","A选项":"A.污染防治设施与主体工程同时设计","B选项":"B.污染防治设施与主体工程同时施工","C选项":"C.污染防治设施与主体工程同时投产使用","D选项":"D.环保台账与生产台账同时建立","正确答案":"A、B、C"},{"题号":"题1567","题干":"工业企业大气污染防治需落实的措施有（ ）。","A选项":"A.配套除尘、脱硫、脱硝治理装置","B选项":"B.密闭储存、转运粉状原辅材料，配套抑尘措施","C选项":"C.使用低VOCs原辅材料，配套废气收集处理设施","D选项":"D.油气储罐安装油气回收装置","正确答案":"A、B、C、D"},{"题号":"题1568","题干":"涉废水排放企业水污染防控法定要求包含（ ）。","A选项":"A.工业废水分类收集、分质处理，禁止稀释排放","B选项":"B.厂区设置规范化排污口，严禁私设排口","C选项":"C.化工等企业配套地下水防渗、监测设施","D选项":"D.生产废水预处理达标后方可接入园区污水处理厂","正确答案":"A、B、C、D"},{"题号":"题1569","题干":"企业产生危险废物，必须落实管理要求有（ ）。","A选项":"A.建立危险废物管理台账，全程记录流向","B选项":"B.危险废物分区、分类贮存，设置专用警示标识","C选项":"C.委托持有危废经营许可证单位处置","D选项":"D.转移危废执行电子/纸质转移联单","正确答案":"A、B、C、D"},{"题号":"题1570","题干":"关于危险废物收集、贮存管理，依据《中华人民共和国生态环境法典》第五百三十五条，下列说法正确的有（ ）。","A选项":"A.收集、贮存危险废物，应当按照危险废物特性分类开展","B选项":"B.禁止混合收集、贮存、运输或者处置性质不相容而未经安全性处置的危险废物","C选项":"C.禁止将危险废物混入非危险废物中贮存","D选项":"D.取得危险废物经营许可证的单位贮存危险废物，如需延期，直接自行延长贮存期限即可","正确答案":"A、B、C"},{"题号":"题1571","题干":"工业固体废物企业管理义务包含（ ）。","A选项":"A.建立固废产生、贮存、转运、处置全流程台账","B选项":"B.配套规范贮存场所，采取防扬散、防渗漏措施","C选项":"C.不得向生活垃圾收集点倾倒工业废渣","D选项":"D.委托处置前核查受托单位资质","正确答案":"A、B、C、D"},{"题号":"题1572","题干":"生产企业噪声污染防治工作要求有（ ）。","A选项":"A.高噪声设备配套减振、隔音降噪设施","B选项":"B.合理规划厂区设备布局，远离居民区","C选项":"C.厂区边界噪声达标，定期自行监测","D选项":"D.夜间施工噪声项目提前办理相关手续","正确答案":"A、B、C、D"},{"题号":"题1573","题干":"涉化学品生产企业需落实新污染物管控工作有（ ）。","A选项":"A.建立有毒化学品使用、排放台账","B选项":"B.落实重点管控新污染物替代方案","C选项":"C.配套化学品泄漏应急收集、处置设施","D选项":"D.依法开展化学物质环境信息申报","正确答案":"A、B、C、D"},{"题号":"题1574","题干":"企业发生突发生态环境事件，第一时间处置措施包括（ ）。","A选项":"A.立即切断、控制污染源，防止污染扩大","B选项":"B.及时通报周边受影响单位、群众","C选项":"C.第一时间向生态环境、应急部门报告","D选项":"D.启动企业环境应急预案开展处置","正确答案":"A、B、C、D"},{"题号":"题1575","题干":"企业环境应急预案必备内容有（ ）。","A选项":"A.环境风险隐患排查清单","B选项":"B.污染物泄漏、火灾等应急处置流程","C选项":"C.应急物资、装备储备清单","D选项":"D.内部应急联络、外部上报渠道","正确答案":"A、B、C、D"},{"题号":"题1576","题干":"企业环保自行监测工作法定要求有（ ）。","A选项":"A.配备合格监测设备、专业人员","B选项":"B.监测全过程规范，保证数据真实完整","C选项":"C.原始监测记录保存不少于五年","D选项":"D.监测数据异常立即排查并上报主管部门","正确答案":"A、B、C、D"},{"题号":"题1577","题干":"法律规定，哪些环保信息企业应当主动公开（ ）。","A选项":"A.污染物排放浓度、排放量监测数据","B选项":"B.污染防治设施运行状态","C选项":"C.危险废物产生、处置去向","D选项":"D.突发环境事件处置情况","正确答案":"A、B、C、D"},{"题号":"题1578","题干":"企业存在哪些行为，生态环境部门可依法查封扣押设备（ ）。","A选项":"A.违法排污造成严重污染风险","B选项":"B.证据存在灭失、隐匿风险","C选项":"C.拒不配合现场监督检查","D选项":"D.合规达标生产、主动配合检查","正确答案":"A、B"},{"题号":"题1579","题干":"生态环境部门现场检查时，企业配合义务有（ ）。","A选项":"A.安排专人陪同检查","B选项":"B.如实提供台账、监测报告等资料","C选项":"C.开放生产车间、治污设施、贮存场所","D选项":"D.不得阻拦、干扰现场采样、拍照","正确答案":"A、B、C、D"},{"题号":"题1580","题干":"企业落实清洁生产的法定措施包含（ ）。","A选项":"A.采用低毒低害原辅材料替代高毒原料","B选项":"B.选用低污染物排放工艺、设备","C选项":"C.生产废弃物综合回收利用","D选项":"D.配套完善末端污染治理设施","正确答案":"A、B、C、D"},{"题号":"题1581","题干":"需要开展强制性清洁生产审核的企业情形有（ ）。","A选项":"A.污染物超排放标准","B选项":"B.超出重点污染物总量控制指标","C选项":"C.使用有毒有害原料开展生产","D选项":"D.企业年产值大幅下降","正确答案":"A、B、C、E"},{"题号":"题1582","题干":"厂区扬尘污染管控措施包含（ ）。","A选项":"A.原料堆场全覆盖防尘网","B选项":"B.物料装卸配套喷淋抑尘设备","C选项":"C.厂区道路定期洒水清扫","D选项":"D.运输车辆密闭、冲洗轮胎出场","正确答案":"A、B、C、D"},{"题号":"题1583","题干":"生产企业挥发性有机物（VOCs）治理要求（ ）。","A选项":"A.涂装、印刷工序密闭作业","B选项":"B.配套VOCs收集、净化装置","C选项":"C.储罐安装油气回收设施","D选项":"D.定期检查管道阀门，杜绝物料泄漏","正确答案":"A、B、C、D"},{"题号":"题1584","题干":"涉水生产企业地下水防渗措施有（ ）。","A选项":"A.危废仓库、废水池做防渗硬化","B选项":"B.设置渗漏收集导流 const $ = id => document.getElementById(id);
let stream = null, worker = null;

function normalize(s){
  return String(s||"").toLowerCase()
    .replace(/[，。！？；：、“”‘’（）()【】\[\]《》<>「」『』\s.,!?;:'"、\-—_]/g,"")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
}
function grams(s){
  const n=normalize(s), out=new Set();
  if(n.length<2){for(const c of n)out.add(c);return out}
  for(let i=0;i<n.length-1;i++)out.add(n.slice(i,i+2));
  return out;
}
function similarity(a,b){
  const A=grams(a), B=grams(b);
  if(!A.size||!B.size)return 0;
  let inter=0; for(const x of A)if(B.has(x))inter++;
  return 2*inter/(A.size+B.size);
}
function scoreQuestion(query,q){
  const qstem=q["题干"]||"";
  const queryN=normalize(query), stemN=normalize(qstem);
  let best=similarity(query,qstem);
  // OCR整页包含选项时，题干片段匹配仍是主依据；选项也提供少量辅助信息
  const opts=["A选项","B选项","C选项","D选项"].map(k=>q[k]||"").join(" ");
  best=Math.max(best, similarity(query, qstem+" "+opts)*0.88);
  if(queryN.length>=8 && stemN.includes(queryN)) best=Math.max(best,0.99);
  if(stemN.length>=8 && queryN.includes(stemN)) best=Math.max(best,0.98);
  // 对OCR文本中较长的连续片段进行匹配
  const chunks=query.match(/[\u4e00-\u9fff]{4,}/g)||[];
  for(const chunk of chunks){
    const cn=normalize(chunk);
    if(cn.length>=5 && stemN.includes(cn)) best=Math.max(best,0.90+Math.min(cn.length,15)*0.005);
  }
  return best;
}
function renderResults(items, query){
  const box=$("results"); box.innerHTML="";
  if(!items.length){box.innerHTML="<p class='small'>没有找到匹配题目。请检查识别文字，尝试删去页眉、题号等干扰内容，或手动输入更完整的题干。</p>";return}
  items.forEach(({q,s},i)=>{
    const el=document.createElement("article"); el.className="result";
    const title=document.createElement("h3"); title.textContent=q["题号"]+"　"+q["题干"];
    const score=document.createElement("span");score.className="score";score.textContent="匹配度 "+Math.round(s*100)+"%";
    const meta=document.createElement("div");meta.className="meta";meta.textContent="候选 "+(i+1);
    meta.appendChild(score);
    el.append(meta,title);
    ["A选项","B选项","C选项","D选项"].forEach(k=>{
      if(!q[k])return;
      const o=document.createElement("div");o.className="option";
      if((q["正确答案"]||"").split(/[、,，\s]+/).includes(k[0]))o.classList.add("correct");
      o.textContent=q[k];el.append(o);
    });
    const ans=document.createElement("div");ans.className="answer";ans.textContent="正确答案："+(q["正确答案"]||"未提供");
    el.append(ans);box.append(el);
  });
}
function searchBank(){
  const query=$("ocrText").value.trim();
  if(query.length<2){$("searchStatus").textContent="请先输入或识别题干文字。";return}
  const ranked=BANK.map(q=>({q,s:scoreQuestion(query,q)})).sort((a,b)=>b.s-a.s);
  const top=ranked.slice(0,5);
  $("searchStatus").textContent=`题库共 ${BANK.length} 道，已显示最相近的 ${top.length} 道候选题。请核对题干和选项，不要仅凭匹配度判断。`;
  renderResults(top,query);
}
async function ensureWorker(){
  if(!window.Tesseract)throw new Error("OCR组件加载失败。请检查网络连接后刷新页面。");
  if(!worker){
    $("ocrStatus").textContent="正在加载中文OCR识别模型，首次加载可能需要一些时间……";
    worker=await Tesseract.createWorker("chi_sim+eng",1,{
      logger:m=>{if(m.status)$("ocrStatus").textContent=m.status+(m.progress!=null?"："+Math.round(m.progress*100)+"%":"")}
    });
  }
  return worker;
}
async function recognize(file){
  try{
    $("ocrStatus").textContent="正在准备图片和中文识别模型……";
    const w=await ensureWorker();
    $("ocrStatus").textContent="正在识别图片文字……";
    const {data}=await w.recognize(file);
    $("ocrText").value=data.text.trim();
    $("ocrStatus").textContent="识别完成。请检查文字，必要时修正后点击“在题库中查找答案”。";
    if(data.text.trim())searchBank();
  }catch(e){$("ocrStatus").textContent="识别失败："+e.message}
}
$("start").onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error("当前环境不支持摄像头，需使用HTTPS网页并通过支持的浏览器打开。");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    $("camera").srcObject=stream;$("camera").style.display="block";
    $("capture").disabled=false;$("stop").disabled=false;
    $("ocrStatus").textContent="摄像头已开启，请将题目对准画面。";
  }catch(e){$("ocrStatus").textContent="无法打开摄像头："+e.message}
};
$("stop").onclick=()=>{
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("camera").style.display="none";$("capture").disabled=true;$("stop").disabled=true;
};
$("capture").onclick=async()=>{
  const v=$("camera"),c=$("canvas");
  if(!v.videoWidth){$("ocrStatus").textContent="摄像头画面尚未就绪，请稍等。";return}
  c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  c.toBlob(blob=>{if(blob){$("preview").src=URL.createObjectURL(blob);$("preview").style.display="block";recognize(blob)}}, "image/jpeg",0.92);
};
$("imageFile").onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  $("preview").src=URL.createObjectURL(f);$("preview").style.display="block";recognize(f);
};
$("search").onclick=searchBank;
$("clear").onclick=()=>{$("ocrText").value="";$("results").innerHTML="";$("searchStatus").textContent="";$("ocrStatus").textContent="已清空。"};
</script>
</body></html>
